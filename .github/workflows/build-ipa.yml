name: Build IPA

# 说明：本机是 Windows，无法编译 iOS IPA；此工作流在 GitHub 的 macOS runner 上
# 自动编译。默认产出「未签名 IPA」（用于侧载，再用你自己的开发证书签名）。
# 若仓库配置了以下 Secrets，则走「签名导出」流程：
#   BUILD_CERTIFICATE_BASE64  开发/分发证书 p12 的 base64
#   P12_PASSWORD              p12 密码
#   BUILD_PROVISION_PROFILE_BASE64   mobileprovision 的 base64
#   TEAM_ID                   Apple Team ID（写入 ExportOptions.plist）
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (with iOS target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Rust xcframework
        run: cd core && ./build_xcframework.sh

      - name: Provide rcodesign (iOS, optional)
        run: |
          mkdir -p SideInjector
          # 把编译好的 iOS 版 rcodesign 放到 SideInjector/rcodesign 即可启用运行时签名；
          # 不提供不影响「解包/注入/打包」，仅影响 App 内的重签按钮。
          test -x SideInjector/rcodesign || echo "::warning::未找到 rcodesign，运行时签名将不可用"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Detect signing secrets
        id: sign
        env:
          P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROV: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROV" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate & profile (signed path)
        if: steps.sign.outputs.enabled == 'true'
        env:
          P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROV: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          KEYCHAIN=build.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security unlock-keychain -p "" "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROV" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          # 把 Team ID 写入 ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" ExportOptions.plist

      - name: Archive (signed)
        if: steps.sign.outputs.enabled == 'true'
        run: |
          xcodebuild -project SideInjector.xcodeproj -scheme SideInjector \
            -configuration Release -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/SideInjector.xcarchive archive

      - name: Archive (unsigned)
        if: steps.sign.outputs.enabled != 'true'
        run: |
          xcodebuild -project SideInjector.xcodeproj -scheme SideInjector \
            -configuration Release -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/SideInjector.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Export IPA (signed)
        if: steps.sign.outputs.enabled == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/SideInjector.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Package IPA (unsigned)
        if: steps.sign.outputs.enabled != 'true'
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/SideInjector.xcarchive/Products/Applications/SideInjector.app build/ipa/Payload/
          cd build/ipa && zip -r ../SideInjector.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInjector.ipa
          path: build/SideInjector.ipa
