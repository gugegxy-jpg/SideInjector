name: Build IPA

# 说明：本机是 Windows，无法编译 iOS IPA；此工作流在 GitHub 的 macOS runner 上
# 自动编译。默认产出「未签名 IPA」（用于侧载，再用你自己的开发证书签名）。
# 若仓库配置了以下 Secrets，则走「签名导出」流程：
#   BUILD_CERTIFICATE_BASE64  开发/分发证书 p12 的 base64
#   P12_PASSWORD              p12 密码
#   BUILD_PROVISION_PROFILE_BASE64   mobileprovision 的 base64
#   TEAM_ID                   Apple Team ID（写入 ExportOptions.plist）
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    # 创建 Release 需要写权限（Release 资源下载通常比 Actions artifact 快得多，且支持断点续传）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (with iOS target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Rust xcframework
        run: cd core && bash ./build_xcframework.sh

      # 说明：这里原本还有一条
      #   cargo install apple-codesign@0.27.0 --target aarch64-apple-ios
      # 用来编译 rcodesign 命令行工具并塞进 App。已移除，因为：
      #   1) iOS 禁止 App fork/exec 子进程，rcodesign 根本无法被调用；
      #   2) 现在签名是「进程内库签名」—— core 直接链接 apple-codesign
      #      （default-features=false），与 rcodesign 无关；
      #   3) 那条命令用默认特性，会把 notarize / app-store-connect 全家桶
      #      （aws-sdk-s3、aws-config、app-store-connect、dialoguer、serde_yaml、
      #      tungstenite… 数百个 crate）一起为 iOS 交叉编译，每次构建要多花好几分钟。
      # 移除后构建明显更快、IPA 也更小。

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Detect signing secrets
        id: sign
        env:
          P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROV: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROV" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate & profile (signed path)
        if: steps.sign.outputs.enabled == 'true'
        env:
          P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROV: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          KEYCHAIN=build.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security unlock-keychain -p "" "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROV" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          # 把 Team ID 写入 ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" ExportOptions.plist

      - name: Archive (signed)
        if: steps.sign.outputs.enabled == 'true'
        run: |
          xcodebuild -project SideInjector.xcodeproj -scheme SideInjector \
            -configuration Release -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/SideInjector.xcarchive archive

      - name: Archive (unsigned)
        if: steps.sign.outputs.enabled != 'true'
        run: |
          xcodebuild -project SideInjector.xcodeproj -scheme SideInjector \
            -configuration Release -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/SideInjector.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Export IPA (signed)
        if: steps.sign.outputs.enabled == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/SideInjector.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Package IPA (unsigned)
        if: steps.sign.outputs.enabled != 'true'
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/SideInjector.xcarchive/Products/Applications/SideInjector.app build/ipa/Payload/
          cd build/ipa && zip -r ../SideInjector.ipa Payload

      - name: Upload IPA (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SideInjector.ipa
          # 未签名流程产物在 build/，签名导出流程在 build/ipa/，两个都覆盖
          path: |
            build/SideInjector.ipa
            build/ipa/SideInjector.ipa
          if-no-files-found: error

      # 额外发布到 Release：Release 资源走另一套 CDN，通常比 Actions artifact 快很多，
      # 而且支持断点续传（可用 aria2c / IDM 多线程下载）。
      # 固定下载地址：https://github.com/<owner>/<repo>/releases/latest/download/SideInjector.ipa
      - name: Publish Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA=build/SideInjector.ipa
          [ -f "$IPA" ] || IPA=build/ipa/SideInjector.ipa
          ls -lh "$IPA"
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI 不可用，跳过 Release 发布（artifact 仍可用）"
            exit 0
          fi
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$IPA" \
            --title "SideInjector 最新构建" \
            --notes "commit ${GITHUB_SHA:0:7} · $(date -u +%Y-%m-%dT%H:%MZ)"
