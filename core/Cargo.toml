[package]
name = "sideinjector-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "sideinjector_core"
crate-type = ["staticlib"]

[dependencies]
anyhow = "1"
zip = "2"
# 打开 apple-codesign / apple-bundles 的内部日志（它们的 IO 错误不带路径，
# 只有日志才能看出失败发生在哪个 bundle / 哪个文件）。
log = "0.4"
# 进程内库签名：iOS 禁止 App fork/exec 子进程（spawn 会报 operation not permitted），
# 不能把 rcodesign 当外部二进制调用，因此直接链接 apple-codesign。
# default-features=false 关掉 notarize，避免 aws-sdk-s3/app-store-connect 等重依赖拖累 iOS 交叉编译。
apple-codesign = { version = "0.27", default-features = false }
plist = "1"
# 设备端自配对（Remote Pairing）与安装链路的**协议实现**均来自此 crate（MIT）。
# 配对流程的组织方式参考 FrizzleM/SideInstaller 的 rust-core/src/pairing.rs，见 README「代码出处与致谢」。
# remote_pairing 用于起 PairableHost 自配对；tcp 启用 tokio/net（TcpListener）；
# ring 启用 rustls（PairingFile 类型被 #[cfg(feature="rustls")] 门控，不启用则 idevice 自身编译不过）。
# rsd/afc/installation_proxy：设备端安装走 CoreDevice/RSD 路径（iOS 17+ 本机 49152）。
idevice = { version = "0.1.63", default-features = false, features = ["remote_pairing", "tcp", "ring", "rsd", "afc", "installation_proxy"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }
