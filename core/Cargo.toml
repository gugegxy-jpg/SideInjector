[package]
name = "sideinjector-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "sideinjector_core"
crate-type = ["staticlib"]

[dependencies]
anyhow = "1"
zip = "2"
# 打开 apple-codesign / apple-bundles 的内部日志（它们的 IO 错误不带路径，
# 只有日志才能看出失败发生在哪个 bundle / 哪个文件）。
log = "0.4"
# idevice 内部日志走 `tracing`（不是 log）：不桥接就看不到它的 warn
# （例如 RsdHandshake 解析服务表时「缺 Entitlement / Port 非字符串」会 warn + 跳过该服务）。
tracing = "0.1"
tracing-subscriber = "0.3"
# 进程内库签名：iOS 禁止 App fork/exec 子进程（spawn 会报 operation not permitted），
# 不能把 rcodesign 当外部二进制调用，因此直接链接 apple-codesign。
# default-features=false 关掉 notarize，避免 aws-sdk-s3/app-store-connect 等重依赖拖累 iOS 交叉编译。
apple-codesign = { version = "0.27", default-features = false }
plist = "1"
# 设备端自配对（Remote Pairing）与安装链路的**协议实现**均来自此 crate（MIT）。
# 配对流程的组织方式参考 FrizzleM/SideInstaller 的 rust-core/src/pairing.rs，见 README「代码出处与致谢」。
# remote_pairing：自配对 + RP 客户端 + TLS-PSK 隧道（connect_tls_psk_tunnel_native）；
# tcp：启用 tokio/net；ring 启用 rustls（PairingFile 类型被 #[cfg(feature="rustls")] 门控）；
# rsd/afc/installation_proxy：安装走 AFC 上传 + installation_proxy；
# tunnel_tcp_stack：启用内置的**用户态 TCP 栈**（jktcp 0.1.6，MIT）——
#   设备端拿不到 TUN 权限，CDTunnel 里只有裸 IPv6 包，必须在用户态实现 TCP 才能连 RSD 服务。
idevice = { version = "0.1.63", default-features = false, features = ["remote_pairing", "tcp", "ring", "rsd", "afc", "installation_proxy", "tunnel_tcp_stack"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }
