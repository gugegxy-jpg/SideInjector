# XcodeGen 规格：在 macOS 上 `xcodegen generate` 生成 SideInjector.xcodeproj
name: SideInjector
options:
  bundleIdPrefix: com.example.sideinjector
  deploymentTarget:
    iOS: "17.0"
targets:
  SideInjector:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SideInjector
        excludes:
          - rcodesign
    # 注意：这里绝对不能写 `info:`。XcodeGen 只要看到 info.path，每次 generate
    # 都会用 info.properties（此处为空）重写该文件，把下面手写 Info.plist 里的
    # 自定义键全部清空，导致：
    #   - UILaunchStoryboardName 丢失 → 无启动屏 → iPhone 被按兼容模式渲染 → 上下黑块
    #   - NSLocalNetworkUsageDescription / NSBonjourServices 丢失
    #     → 本地网络不弹授权框，且 Bonjour 直接报 -65555 (kDNSServiceErr_NoAuth)
    # 只用 INFOPLIST_FILE 指向手写文件即可。
    dependencies:
      - framework: core/build/sideinjector_core.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sideinjector
        INFOPLIST_FILE: SideInjector/Info.plist
        CODE_SIGN_ENTITLEMENTS: SideInjector/SideInjector.entitlements
        OTHER_LDFLAGS: ["-ObjC"]
        # 同时支持 iPhone 与 iPad，避免 iPad 落入「iPhone 兼容模式」（黑边/2x 放大）。
        # 之前的 LaunchScreen 尝试就是为修这个；根本原因是设备家族未设成 universal。
        TARGETED_DEVICE_FAMILY: "1,2"
        # 内置 rcodesign(iOS) 由 CI 编译到 SideInjector/rcodesign，
        # 由下方 scriptPhases 拷进 App 并加可执行权限；运行时设 RCODESIGN_PATH 指向它。
    scriptPhases:
      - name: Bundle rcodesign (iOS)
        shellPath: /bin/sh
        script: |
          if [ -f "${SRCROOT}/SideInjector/rcodesign" ]; then
            cp "${SRCROOT}/SideInjector/rcodesign" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/rcodesign"
            chmod +x "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/rcodesign"
            echo "bundled rcodesign"
          else
            echo "warning: SideInjector/rcodesign not found; in-app signing disabled"
          fi
